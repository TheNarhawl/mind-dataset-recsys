[project]
name = "mind-recsys"
version = "0.1.0"
description = "Two-Stage News Recommender System on MIND dataset (Qdrant + CatBoostRanker + MLflow + Evidently + FastAPI)"
readme = "README.md"
authors = [
    { name = "Daneelka", email = "danah29122003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mind-recsys = "mind_recsys:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
