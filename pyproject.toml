[project]
name = "mind-recsys"
version = "0.1.0"
description = "Two-Stage News Recommender System on MIND dataset (Qdrant + CatBoostRanker + MLflow + Evidently + FastAPI)"
readme = "README.md"
authors = [
    { name = "Daneelka", email = "danah29122003@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "catboost>=1.2.0",
    "evidently>=0.7.23",
    "fastapi>=0.110.0",
    "mlflow>=2.15.0",
    "numpy>=1.24.0",
    "pandas<3.0.0,>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.9.0",
    "requests>=2.28.0",
    "scipy>=1.10.0",
    "sentence-transformers>=3.0.0",
    "tqdm>=4.65.0",
    "uvicorn>=0.28.0",
]

[project.scripts]
mind-recsys = "mind_recsys:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
